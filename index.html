<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1224" />
    <title>Le Chaton Bretteur</title>

    <!-- PWA : installable + plein écran sur mobile -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chaton Bretteur" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* fond thématique qui remplit les bords (letterbox) : plus de zones noires mortes */
        background: #0a0710 radial-gradient(130% 130% at 50% 32%, #201636 0%, #130d20 52%, #08060e 100%) fixed;
        font-family: system-ui, -apple-system, sans-serif;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #game {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* superposition des contrôles tactiles (mobile) */
      #tc-root { position: fixed; inset: 0; z-index: 10; pointer-events: none; touch-action: none; }
      .tc-btn {
        position: absolute; pointer-events: auto; display: flex; align-items: center; justify-content: center;
        border-radius: 50%; color: #fff; font-weight: 800; user-select: none; -webkit-user-select: none;
        transition: transform .06s ease; will-change: transform;
      }
      .tc-joy { position: absolute; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); display: none; }
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #f4e9c1;
        gap: 16px;
        z-index: 10;
      }
      #loading .title { font-size: 22px; letter-spacing: 2px; font-weight: 800; }
      #loading .paw { font-size: 42px; animation: bob 1s ease-in-out infinite; }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="loading">
      <div class="paw">🐾</div>
      <div class="title">LE CHATON BRETTEUR</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
